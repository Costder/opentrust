name: OpenTrust Passport Generator
description: Generate an OpenTrust passport draft for your tool on each release and open a PR for creator review.
author: Costder

inputs:
  tool_name:
    description: Display name for the tool (defaults to repo name)
    required: false
    default: ''
  tool_category:
    description: 'Tool category: search, code-execution, database, file-management, communication, data-analysis, image-generation, audio, video, browser, calendar, crm, finance, hr, legal, marketing, monitoring, security, translation, custom'
    required: false
    default: 'custom'
  github_token:
    description: GitHub token for creating the PR
    required: true
    default: ${{ github.token }}
  python_version:
    description: Python version to use for passport generation
    required: false
    default: '3.11'

outputs:
  passport_path:
    description: Path to the generated passport file
    value: ${{ steps.generate.outputs.passport_path }}
  pr_url:
    description: URL of the created pull request
    value: ${{ steps.create_pr.outputs.pull-request-url }}

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python_version }}

    - name: Install passport-generator
      shell: bash
      run: pip install -e "${{ github.action_path }}/../../passport-generator" --quiet

    - name: Generate passport draft
      id: generate
      shell: bash
      env:
        TOOL_NAME: ${{ inputs.tool_name }}
        TOOL_CATEGORY: ${{ inputs.tool_category }}
        REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        RELEASE_TAG: ${{ github.ref_name }}
        COMMIT_SHA: ${{ github.sha }}
      run: |
        python - <<'PYEOF'
        import json, os, sys

        repo_url = os.environ["REPO_URL"]
        tool_name = os.environ["TOOL_NAME"] or os.environ.get("GITHUB_REPOSITORY", "unknown").split("/")[-1]
        category = os.environ["TOOL_CATEGORY"]
        version = os.environ.get("RELEASE_TAG", "0.0.0").lstrip("v")
        commit = os.environ["COMMIT_SHA"][:12]

        sys.path.insert(0, os.path.join(os.environ.get("GITHUB_ACTION_PATH", "."), "../../passport-generator/src"))
        try:
            from passport_generator.generator import generate
        except ImportError:
            # Fallback: build a minimal draft manually
            slug = tool_name.lower().replace(" ", "-").replace("_", "-")
            passport = {
                "spec_version": "0.1.0",
                "tool_identity": {
                    "name": tool_name,
                    "slug": slug,
                    "source_url": repo_url,
                    "category": category,
                    "license": "UNKNOWN",
                    "maintainers": []
                },
                "trust_status": "auto_generated_draft",
                "version_hash": {
                    "version": version,
                    "commit": commit,
                    "artifact_hash": "sha256:REPLACE_WITH_ACTUAL_ARTIFACT_HASH"
                },
                "capabilities": ["TODO: describe what this tool does"],
                "permission_manifest": {},
                "source_formats": ["mcp"],
                "warning": "AUTO-GENERATED DRAFT - review all fields before advancing trust status"
            }
        else:
            passport = generate(name=tool_name, source_url=repo_url)
            passport["version_hash"] = {
                "version": version,
                "commit": commit,
                "artifact_hash": "sha256:REPLACE_WITH_ACTUAL_ARTIFACT_HASH"
            }
            passport.get("tool_identity", {})["category"] = category

        path = "opentrust-passport.json"
        with open(path, "w") as f:
            json.dump(passport, f, indent=2)
        print(f"Generated {path}")

        output_file = os.environ.get("GITHUB_OUTPUT", "/dev/null")
        with open(output_file, "a") as out:
            out.write(f"passport_path={path}\n")
        PYEOF

    - name: Create PR with passport draft
      id: create_pr
      uses: peter-evans/create-pull-request@v6
      with:
        token: ${{ inputs.github_token }}
        add-paths: opentrust-passport.json
        commit-message: "chore(opentrust): auto-generate passport draft for ${{ github.ref_name }}"
        branch: opentrust/passport-draft-${{ github.ref_name }}
        title: "[OpenTrust] Passport draft for ${{ github.ref_name }} — creator review needed"
        body: |
          ## OpenTrust Passport Draft

          This PR was auto-generated by the [OpenTrust GitHub Action](https://github.com/Costder/opentrust) on release `${{ github.ref_name }}`.

          ### What you need to do

          - [ ] Review `tool_identity` — confirm name, category, license, and maintainers
          - [ ] Replace `permission_manifest` booleans with [v0.2 granular scopes](https://github.com/Costder/opentrust/blob/main/rfcs/0005-granular-permissions.md)
          - [ ] Replace `version_hash.artifact_hash` with the real SHA-256 of your release artifact
          - [ ] Fill in `capabilities` with accurate descriptions
          - [ ] Run `opentrust validate opentrust-passport.json` to confirm the passport is valid
          - [ ] Claim ownership at https://registry.opentrust.dev to move from `auto_generated_draft` to `creator_claimed`

          An `auto_generated_draft` passport is **not agent-usable** — agents require at least `owner_confirmed` trust status.
        delete-branch: true
